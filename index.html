<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tạo Đơn GHTK</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #008848; font-size: 16px; border-bottom: 2px solid #008848; padding-bottom: 6px; }
        label { font-size: 12px; font-weight: bold; display: block; margin-top: 8px; }
        input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        .btn-main { background: #008848; color: white; border: none; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>➕ TẠO ĐƠN HÀNG MỚI</h2>
    <form id="orderForm">
        <label>Tên người nhận:</label>
        <input type="text" id="name" required placeholder="Nhập tên...">
        <label>Số điện thoại:</label>
        <input type="tel" id="phone" required placeholder="Nhập SĐT...">
        <label>Địa chỉ nhận hàng:</label>
        <input type="text" id="address" required placeholder="Số nhà, đường, quận...">
        <label>Tiền thu hộ COD (VNĐ):</label>
        <input type="number" id="cod" value="0" required>
        <button type="submit" class="btn-main">TẠO ĐƠN NGAY</button>
    </form>
</div>
<script>
    document.getElementById('orderForm').addEventListener('submit', (e) => {
        e.preventDefault();
        let orders = JSON.parse(localStorage.getItem('ghtk_orders')) || [];
        let now = new Date();
        let timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + ' ' + now.getDate() + '/' + (now.getMonth() + 1);
        let newOrder = {
            id: 'GHTK' + Math.floor(100000 + Math.random() * 900000),
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            cod: document.getElementById('cod').value,
            timeline: [{ time: timeStr, status: 'Đã tạo đơn hàng thành công' }]
        };
        orders.unshift(newOrder);
        localStorage.setItem('ghtk_orders', JSON.stringify(orders));
        alert('Tạo đơn thành công! Mã: ' + newOrder.id);
        document.getElementById('orderForm').reset();
    });
</script>
</body>
</html>
